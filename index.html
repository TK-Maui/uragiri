<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ウラギリ オンライン版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E8EC;--slab:#F7F8FA;--ink:#1F2229;--mute:#5B6270;--line:#C9CED6;
  --torch:#B7791F;--a:#23807A;--b:#A83D68;--path:#8A7552;--rock:#6B6F78;--cell:#D7DBE2;--gold:#D19A2A;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1E25;--slab:#272B34;--ink:#ECE8DF;--mute:#9BA1AB;--line:#3A3F4A;
    --torch:#E3A33B;--a:#48B5AD;--b:#D56C95;--path:#C9B27F;--rock:#8A8F99;--cell:#21252D;--gold:#E8B84A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1E25;--slab:#272B34;--ink:#ECE8DF;--mute:#9BA1AB;--line:#3A3F4A;
  --torch:#E3A33B;--a:#48B5AD;--b:#D56C95;--path:#C9B27F;--rock:#8A8F99;--cell:#21252D;--gold:#E8B84A;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6}
.dot{font-family:"DotGothic16","Zen Kaku Gothic New",monospace}
header{display:flex;align-items:baseline;gap:12px;padding:14px 16px 6px;max-width:980px;margin:0 auto}
header h1{margin:0;font-size:28px;letter-spacing:.08em;font-weight:400}
header .sub{color:var(--mute);font-size:13px}
main{max-width:980px;margin:0 auto;padding:0 12px 40px}
section{margin:12px 0}
h2{font-size:15px;margin:0 0 8px;font-weight:700}
.panel{background:var(--slab);border:1px solid var(--line);border-radius:10px;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--slab);color:var(--ink);border-radius:8px;padding:8px 14px;min-height:44px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--torch);color:#1B1408;border-color:transparent;font-weight:700}
.btn.small{min-height:36px;padding:4px 10px;font-size:13px}
.btn:focus-visible,.card:focus-visible,.cell:focus-visible,.chip:focus-visible{outline:3px solid var(--torch);outline-offset:2px}
.muted{color:var(--mute);font-size:13px}
.teamA{color:var(--a)}.teamB{color:var(--b)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.teamcol{border-top:4px solid var(--a)}.teamcol.b{border-top-color:var(--b)}
.teamcol ol{margin:6px 0 10px;padding-left:22px}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status .panel{padding:8px 10px}
.status b{font-weight:700}
.banner{border-left:4px solid var(--torch);background:var(--slab);padding:8px 12px;border-radius:6px;margin:8px 0}
.boardScroll{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:10px;background:var(--slab);padding:8px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(17,42px);grid-template-rows:16px;grid-auto-rows:42px;gap:2px;width:max-content}
.cell{width:42px;height:42px;border:0;padding:0;background:var(--cell);border-radius:4px;cursor:pointer;position:relative}
.cell.gapcol{background:transparent;outline:1px dashed var(--line);outline-offset:-3px}
.cell.target{outline:2px solid var(--torch);outline-offset:-2px}
.cell svg{display:block}
.start{display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;border-radius:4px}
.start.a{background:var(--a)}.start.b{background:var(--b)}
.room{display:flex;align-items:center;justify-content:center;background:var(--gold);color:#241A05;border-radius:4px;font-size:12px;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent),0 0 16px color-mix(in srgb,var(--gold) 55%,transparent)}
.colnum{font-size:10px;color:var(--mute);text-align:center;line-height:14px;height:14px}
.hand{display:flex;flex-wrap:wrap;gap:8px}
.card{width:64px;min-height:84px;border:2px solid var(--line);border-radius:8px;background:var(--slab);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;cursor:pointer;font:inherit;font-size:11px}
.card.sel{border-color:var(--torch);box-shadow:0 0 0 2px var(--torch)}
.card .glyph{font-size:26px;line-height:1}
.card.act{border-style:dashed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--slab);color:var(--ink);font-size:18px;cursor:pointer}
.chip.off{background:var(--rock);color:var(--bg);text-decoration:line-through}
.maps{display:flex;gap:6px;flex-wrap:wrap}
.log{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto;font-size:13px}
.log li{padding:4px 0;border-bottom:1px solid var(--line)}
.log li.priv{color:var(--torch)}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.tablewrap{overflow-x:auto}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:12px}
.sheet{background:var(--slab);color:var(--ink);border-radius:14px;max-width:480px;width:100%;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
.sheet h3{margin:0 0 10px;font-size:17px}
.big{font-size:48px;text-align:center;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:20;font-size:14px;max-width:90vw}
[hidden]{display:none!important}
@media (max-width:560px){.teams,.status{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
header{flex-wrap:wrap;row-gap:2px}
header h1{white-space:nowrap}
#net{flex-basis:100%;margin-left:0!important;font-size:12px}
</style>
</head>
<body>
<header>
  <h1 class="dot">ウラギリ</h1>
  <span class="sub" id="sub">オンライン版</span>
  <span class="sub" id="net"></span>
</header>
<main id="app">
  <div id="view"></div>
  <section id="logSec" hidden>
    <div class="panel"><h2>ログ</h2><ul class="log" id="log"></ul></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
/* ============ カード定義（1台回し版と共通） ============ */
const TYPES={
  X:{n:"十字路",o:"NESW"},TH:{n:"T字路 横",o:"EWS"},TV:{n:"T字路 縦",o:"NSE"},
  C1:{n:"曲がり道",o:"ES"},C2:{n:"曲がり道",o:"EN"},H:{n:"一本道 横",o:"EW"},V:{n:"一本道 縦",o:"NS"},
  DH:{n:"行き止まり",o:"W",dead:1},DV:{n:"行き止まり",o:"N",dead:1},
  Mh:{n:"地図",o:"W",dead:1,item:"map"},Ph:{n:"覗き見",o:"W",dead:1,item:"peek"},Sh:{n:"偵察",o:"W",dead:1,item:"scout"},
  Rh:{n:"ロープ",o:"W",dead:1,item:"rope"},Fh:{n:"強制配置",o:"W",dead:1,item:"force"},
  Sv:{n:"偵察",o:"N",dead:1,item:"scout"},Rv:{n:"ロープ",o:"N",dead:1,item:"rope"},Fv:{n:"強制配置",o:"N",dead:1,item:"force"}
};
const BASE={X:6,TH:3,TV:3,C1:3,C2:3,H:4,V:3,DH:0,DV:1,Mh:3,Ph:2,Sh:1,Rh:1,Fh:1,Sv:1,Rv:1,Fv:1};
const ADD={3:{X:1,TH:1,C1:1,H:1},4:{X:1,TV:1,C2:1,H:1},5:{X:1,TV:1,C2:1,H:1}};
const ITEM={map:{n:"地図",g:"地"},peek:{n:"覗き見",g:"覗"},scout:{n:"偵察",g:"偵"},rope:{n:"ロープ",g:"縄"},force:{n:"強制配置",g:"強"}};
const LETTERS=["A","B","C","D","E","F"];
const FLIP={N:"S",S:"N",E:"W",W:"E"};
const OPP=FLIP,DIR={N:[-1,0],S:[1,0],E:[0,1],W:[0,-1]};
const ROWS=9,COLS=17,START_ROW=4,ROOM_COL=8,ROOM_ROWS={2:"ABC",6:"DEF"};
const ROLE_TABLE={4:[4,1],5:[5,1],6:[6,2],7:[7,2],8:[8,2],9:[9,2],10:[10,3]};

/* ============ 共通 ============ */
const $=id=>document.getElementById(id);
const rid=(n=6)=>{let s="";while(s.length<n)s+=Math.random().toString(36).slice(2);return s.slice(0,n);};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function typeOf(c){return c.startsWith("act:")?null:c.split(".")[0];}
function actOf(c){return c.startsWith("act:")?c.slice(4).split(".")[0]:null;}
function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k==="on")for(const[ev,fn]of Object.entries(v))e.addEventListener(ev,fn);else if(k==="html")e.innerHTML=v;else if(k==="cls")e.className=v;else e.setAttribute(k,v===true?"":v);}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k instanceof Node?k:document.createTextNode(String(k)));}return e;}
function toast(msg){const t=el("div",{cls:"toast",role:"status"},msg);document.body.append(t);setTimeout(()=>t.remove(),2800);}
const put=(v,...k)=>v.replaceChildren(...k.flat().filter(x=>x!=null&&x!==false&&x!==""));
const teamName=t=>t==="A"?"Aチーム":"Bチーム";
const other=t=>t==="A"?"B":"A";
// テスト用（?local=1&pid=…）では、同じブラウザ内でプレイヤーごとに保存場所を分ける
function lsKey(k){const q=new URLSearchParams(location.search);return q.has("local")&&q.get("pid")?k+"@"+q.get("pid"):k;}
function lsGet(k){try{return localStorage.getItem(lsKey(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(lsKey(k),v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(lsKey(k));}catch(e){}}
function buildDeck(size){const c={...BASE};for(const k of[3,4,5])if(size>=k)for(const[t,v]of Object.entries(ADD[k]))c[t]+=v;const out=[];let i=0;for(const[t,v]of Object.entries(c))for(let j=0;j<v;j++)out.push(t+"."+(i++));return shuffle(out);}
function cardSVG(t,rot,size){
  const T=TYPES[t];let o=T.o.split("");if(rot)o=o.map(d=>FLIP[d]);
  const P={N:[21,0],S:[21,42],E:[42,21],W:[0,21]};
  let s=`<svg viewBox="0 0 42 42" width="${size}" height="${size}" aria-hidden="true"><rect x="1" y="1" width="40" height="40" rx="4" fill="var(--slab)" stroke="var(--line)"/>`;
  for(const d of o){const[x,y]=P[d];s+=`<line x1="${x}" y1="${y}" x2="21" y2="21" stroke="var(--path)" stroke-width="11"/>`;}
  s+=T.dead?`<circle cx="21" cy="21" r="8" fill="var(--rock)"/>`:`<rect x="15.5" y="15.5" width="11" height="11" fill="var(--path)"/>`;
  if(T.item)s+=`<text x="21" y="26" text-anchor="middle" font-size="13" font-family="DotGothic16,monospace" fill="var(--bg)">${ITEM[T.item].g}</text>`;
  return s+"</svg>";
}

/* ============ 道のつながり ============ */
function openingsOf(card,rot){let o=TYPES[typeOf(card)].o.split("");if(rot)o=o.map(d=>FLIP[d]);return o;}
function cellAt(r,c,cells){
  if(r<0||r>=ROWS||c<0||c>=COLS)return{kind:"out"};
  if(r===START_ROW&&c===0)return{kind:"start",team:"A",open:["N","S","E"]};
  if(r===START_ROW&&c===16)return{kind:"start",team:"B",open:["N","S","W"]};
  if(c===ROOM_COL&&ROOM_ROWS[r])return{kind:"room",letters:ROOM_ROWS[r]};
  const x=cells[`r${r}c${c}`];
  return x?{kind:"card",team:x.team,open:openingsOf(x.card,x.rot)}:{kind:"empty"};
}
function network(team,cells){
  const sc=team==="A"?0:16;const seen=new Set([START_ROW+","+sc]);const q=[[START_ROW,sc]];
  const res={cards:[],frontier:new Set(),rooms:new Set()};
  while(q.length){const[r,c]=q.shift();const me=cellAt(r,c,cells);
    if(me.kind==="card")res.cards.push({r,c,team:me.team});
    for(const d of me.open||[]){const[dr,dc]=DIR[d];const nr=r+dr,nc=c+dc;const nb=cellAt(nr,nc,cells);
      if(nb.kind==="empty")res.frontier.add(nr+","+nc);
      else if(nb.kind==="room")res.rooms.add(nb.letters);
      else if(nb.kind==="card"&&nb.open.includes(OPP[d])){const k=nr+","+nc;if(!seen.has(k)){seen.add(k);q.push([nr,nc]);}}}}
  return res;
}
function checkPlace(t,card,rot,r,c,cells){
  if(cellAt(r,c,cells).kind!=="empty")return"そこには置けません。";
  const o=openingsOf(card,rot);
  for(const d of["N","S","E","W"]){const[dr,dc]=DIR[d];const nb=cellAt(r+dr,c+dc,cells);
    if(nb.kind==="card"||nb.kind==="start"){if(o.includes(d)!==nb.open.includes(OPP[d]))return"隣のカードと道の形が合いません。";}}
  const net=network(t,cells);
  if(!net.frontier.has(r+","+c))return"自チームのスタートから続いている道の先にしか置けません。";
  if(t==="A"?c>=9:c<=7){const has8=net.cards.some(x=>x.team===t&&x.c===ROOM_COL);const joined=net.cards.some(x=>x.team!==t);
    if(!has8&&!joined)return"相手の場には、自チームの道が8列目まで届くか、相手の道とつながるまで置けません。";}
  return null;
}
function isBlocked(t,cells){const n=network(t,cells);return n.frontier.size===0&&n.rooms.size===0;}

/* ============ 投票と得点（1台回し版と同じ） ============ */
function tally(v,members){const c={};for(const m of members){const x=v[m.id];if(x!=null)c[x]=(c[x]||0)+1;}return c;}
function voteOutcome(stage,v,members){
  const c=tally(v,members);const any=Object.keys(c).length>0;
  const keys=Object.keys(c).filter(k=>k!=="none");
  if(!keys.length)return any?{type:"pick",target:"none"}:{type:"none"};
  const max=Math.max(...keys.map(k=>c[k]));const top=keys.filter(k=>c[k]===max);
  if(top.length===1)return{type:"pick",target:top[0]};
  if(stage===1)return{type:"revote"};
  return top.length===keys.length?{type:"alleq"}:{type:"tie"};
}

/* ======================================================================
   ホスト側：ゲームの状態をすべて持ち、各端末にその人の見える分だけ送る
   ====================================================================== */
let G=null;
function freshGame(code,hostId){return{code,hostId,phase:"lobby",round:1,seats:[],teams:null,hands:{},cells:{},answer:null,mapdeck:[],scores:{},votes:null,winner:null,blocked:null,log:[],k:0,done:{A:false,B:false},pendingDecl:null,steals:[],result:null};}
const gSeat=id=>G.seats.find(s=>s.id===id);
const gName=id=>{const s=gSeat(id);return s?s.name:"だれか";};
const gOrder=t=>G.seats.filter(s=>s.team===t);
function gCur(t){const o=gOrder(t);if(!o.length)return null;return o[G.k%o.length].id;}
const gRole=id=>(G.hands[id]||{}).role;
function gLog(text,vis){G.log.unshift({text,vis:vis||"all"});G.log=G.log.slice(0,80);}
function ropeOn(h,t,teams){return h&&h.rope!=null&&teams[t].turns>h.rope;}
function forceOn(h,t,teams){return h&&h.force!=null&&teams[t].turns>h.force;}

function hostHandle(pid,a){
  const s=gSeat(pid),t=s&&s.team,h=G.hands[pid],isHost=pid===G.hostId;
  const err=m=>{sendTo(pid,{t:"err",m});};
  switch(a.type){
  case "join":{
    const name=String(a.name||"").slice(0,10)||"プレイヤー";
    if(s){s.name=name;s.online=true;}
    else{
      if(G.phase!=="lobby"){G.watchers=G.watchers||{};G.watchers[pid]=name;break;}
      if(G.seats.length>=10){err("満員です（最大10人）。");break;}
      const nA=gOrder("A").length,nB=gOrder("B").length;
      G.seats.push({id:pid,name,team:nA<=nB?"A":"B",online:true});
    }
    break;}
  case "setTeam":{
    if(G.phase!=="lobby")break;const target=a.who&&isHost?gSeat(a.who):s;if(!target)break;
    if(a.team==="A"||a.team==="B")target.team=a.team;break;}
  case "remove":{if(!isHost||G.phase!=="lobby")break;G.seats=G.seats.filter(x=>x.id!==a.who||x.id===G.hostId);break;}
  case "start":{if(!isHost)break;startRound();break;}
  case "place":placeCard(pid,a);break;
  case "discard":{
    if(!canAct(pid))break;if(!h.cards.includes(a.card))break;
    if(forceBlock(pid)){err("強制配置中は、カードを置く必要があります。");break;}
    consume(pid,a.card);gLog(`${gName(pid)}が手札を1枚捨てた`);break;}
  case "use":useAction(pid,a);break;
  case "end":endTurn(pid,false);break;
  case "pass":endTurn(pid,true);break;
  case "undo":undoLast(pid);break;
  case "chip":{
    if(G.phase!=="play"||!t||!LETTERS.includes(a.L))break;
    const now=!G.teams[t].chips[a.L];G.teams[t].chips[a.L]=now;
    gLog(`${gName(pid)}がチップ「${a.L}」を${now?"裏返した（ハズレ）":"表に戻した"}`,t);break;}
  case "declare":{
    if(G.phase!=="play"||!t)break;
    const rooms=[...network(t,G.cells).rooms].join("");
    if(!LETTERS.includes(a.L)||!rooms.includes(a.L)){err("道がつながった宝の間のアルファベットしか宣言できません。");break;}
    if(!G.pendingDecl||G.pendingDecl.k!==G.k)G.pendingDecl={k:G.k};
    if(G.pendingDecl[t]){err("このターンはもう宣言しています。");break;}
    G.pendingDecl[t]=a.L;
    gLog(`${teamName(t)}が宝の間で宣言しました（結果はこのターンの終わりに出ます）`);
    break;}
  case "penalty":penalty(pid);break;
  case "deckout":{if(G.phase!=="play")break;G.phase="judge";G.winner=null;G.blocked=null;G.votes=null;gLog(`${gName(pid)}が山札切れでラウンドを終えた`);break;}
  case "skip":{ // ホストが、つながらなくなった人の手番を代わりに終える
    if(!isHost||G.phase!=="play")break;const w=a.who;if(!w)break;endTurn(w,true,true);break;}
  case "vote":{
    if(G.phase!=="judge"||!G.votes)break;const L=other(G.winner);if(!t||t!==L)break;
    if(G.votes.v[pid]!=null)break;
    const ok=a.target==="none"||gOrder(L).some(x=>x.id===a.target);if(!ok)break;
    G.votes.v[pid]=a.target;
    const Lm=gOrder(L);
    if(Lm.every(x=>G.votes.v[x.id]!=null)){
      const o=voteOutcome(G.votes.stage,G.votes.v,Lm);
      const c=tally(G.votes.v,Lm);
      gLog("投票結果："+Lm.map(x=>`${x.name}→${G.votes.v[x.id]==="none"?"いない":gName(G.votes.v[x.id])}`).join("、"));
      if(o.type==="revote"){G.votes={stage:2,v:{}};gLog("最多票が複数だったため、再投票します。");}
      else G.votes.final=true;
    }
    break;}
  case "finalize":{
    if(G.phase!=="judge")break;
    const needVote=G.winner&&G.winner!=="both"&&!G.blocked;
    if(needVote&&!(G.votes&&G.votes.final))break;
    finalizeRound();break;}
  case "steal":{
    const st=G.steals[0];if(G.phase!=="reveal"||!st)break;
    if(pid!==st.thief&&!isHost)break;
    const v=a.victim;
    if(v){if(!st.victims.includes(v)||(G.scores[v]||0)<=0)break;}
    else if(st.victims.some(x=>(G.scores[x]||0)>0))break;
    if(v){G.scores[v]=(G.scores[v]||0)-1;G.result.d[v]=(G.result.d[v]||0)-1;}
    G.scores[st.thief]=(G.scores[st.thief]||0)+1;G.result.d[st.thief]=(G.result.d[st.thief]||0)+1;
    gLog(`${gName(st.thief)}が${v?gName(v)+"から":"宝の山から"}宝を1個奪った`);
    st.n--;if(st.n<=0)G.steals.shift();break;}
  case "next":{if(!isHost||G.phase!=="reveal"||G.steals.length)break;G.round++;G.phase="lobby";G.result=null;G.winner=null;G.blocked=null;G.votes=null;
    if(G.watchers){for(const[id,name]of Object.entries(G.watchers)){if(!gSeat(id)&&G.seats.length<10){const nA=gOrder("A").length,nB=gOrder("B").length;G.seats.push({id,name,team:nA<=nB?"A":"B",online:conns.has(id)});}}G.watchers={};}
    break;}
  case "resetScores":{if(!isHost)break;G.scores={};G.round=1;if(G.phase==="reveal")G.phase="lobby";G.steals=[];G.result=null;break;}
  case "score":{if(!isHost)break;G.scores[a.who]=(G.scores[a.who]||0)+(a.d>0?1:-1);break;}
  case "ack":{if(h){if(a.what==="reveal")h.reveal=null;if(a.what==="notice")h.notice=null;}break;}
  case "fix":{ // 盤面のカードを手直し（回転・取り除き）
    if(G.phase!=="play")break;const cell=G.cells[a.cell];if(!cell)break;
    if(a.op==="rot"){cell.rot=cell.rot?0:180;gLog(`${gName(pid)}が盤面のカードを回転した`);}
    else{delete G.cells[a.cell];const tm=G.teams[cell.team];
      if(a.op==="deck")tm.deck=shuffle([...tm.deck,cell.card]);else tm.discard.push(cell.card);
      gLog(`${gName(pid)}が盤面のカードを取り除いた（${a.op==="deck"?"山札":"捨て札"}へ）`);}
    break;}
  }

}
function canAct(pid){const s=gSeat(pid);if(!s||G.phase!=="play")return false;const t=s.team;return gCur(t)===pid&&!G.done[t]&&!G.hands[pid].acted;}
function forceBlock(pid){const t=gSeat(pid).team,h=G.hands[pid];const noD=!h.cards.some(c=>!actOf(c));return forceOn(h,t,G.teams)&&!ropeOn(h,t,G.teams)&&!noD;}
function startRound(){
  const A=gOrder("A"),B=gOrder("B");const all=[...A,...B];const n=all.length;
  if(!A.length||!B.length)return;
  const rt=ROLE_TABLE[n]||[n,1];
  const roles=shuffle([...Array(rt[0]).fill("冒険者"),...Array(rt[1]).fill("裏切者")]).slice(0,n);
  G.teams={};G.hands={};G.cells={};
  for(const[t,list]of[["A",A],["B",B]]){
    let deck=buildDeck(list.length);
    for(const s of list){G.hands[s.id]={cards:deck.slice(0,5),maps:[],rope:null,force:null,acted:false,undo:null,endSnap:null,reveal:null,notice:null};deck=deck.slice(5);}
    G.teams[t]={deck,discard:[],chips:{A:false,B:false,C:false,D:false,E:false,F:false},supply:{peek:2,scout:2,rope:2,force:2},turns:0};
  }
  all.forEach((s,i)=>{G.hands[s.id].role=roles[i];});
  const L=shuffle(LETTERS);G.answer=L[0];G.mapdeck=L.slice(1);
  Object.assign(G,{phase:"play",k:0,done:{A:false,B:false},winner:null,blocked:null,votes:null,pendingDecl:null,steals:[],result:null,log:[]});
  gLog(`第${G.round}ラウンド開始。役割・手札・地図山札を配りました。`);
}
function placeCard(pid,a){
  if(!canAct(pid))return;const t=gSeat(pid).team,h=G.hands[pid];
  if(ropeOn(h,t,G.teams)){sendTo(pid,{t:"err",m:"ロープで拘束中は置けません。"});return;}
  if(!h.cards.includes(a.card)||actOf(a.card))return;
  const rot=a.rot?180:0;const why=checkPlace(t,a.card,rot,a.r,a.c,G.cells);if(why){sendTo(pid,{t:"err",m:why});return;}
  const prev={cards:[...h.cards],maps:[...h.maps]};
  G.cells[`r${a.r}c${a.c}`]={card:a.card,rot,team:t,by:pid};
  h.cards=h.cards.filter(x=>x!==a.card);
  let drawn=null,took=null,got="";
  const item=TYPES[typeOf(a.card)].item;
  if(item==="map"){if(G.mapdeck.length){drawn=G.mapdeck.shift();h.maps.push(drawn);got="地図を1枚引いた";
      h.reveal={title:"地図カード",big:drawn,text:`「${drawn}」はハズレです。衝立のチップを裏返してチームに伝えてください（伝えるのは義務です）。`};}
    else got="地図山札が空だった";}
  else if(item){if(G.teams[t].supply[item]>0){G.teams[t].supply[item]--;took=item;h.cards.push("act:"+item+"."+rid(4));got=ITEM[item].n+"を獲得";}else got=ITEM[item].n+"が品切れだった";}
  h.acted=true;h.undo={kind:"place",prev,cell:`r${a.r}c${a.c}`,card:a.card,map:drawn,item:took,team:t};
  gLog(`${gName(pid)}がダンジョンカードを置いた${got?`（${got}）`:""}`);
}
function consume(pid,card,extra){
  const t=gSeat(pid).team,h=G.hands[pid];
  h.undo=Object.assign({kind:"use",prev:{cards:[...h.cards]},card,team:t},extra||{});
  h.cards=h.cards.filter(x=>x!==card);h.acted=true;G.teams[t].discard.push(card);
}
function useAction(pid,a){
  if(!canAct(pid))return;const t=gSeat(pid).team,h=G.hands[pid];
  if(!h.cards.includes(a.card))return;const kind=actOf(a.card);if(!kind)return;
  if(forceBlock(pid)){sendTo(pid,{t:"err",m:"強制配置中は、カードを置く必要があります。"});return;}
  if(kind==="peek"){
    const tg=G.hands[a.target];if(!tg||a.target===pid||!tg.maps.length)return;
    const i=Math.max(0,Math.min(tg.maps.length-1,a.idx|0));const m=tg.maps[i];
    consume(pid,a.card);
    h.reveal={title:"覗き見の結果",big:m,text:`${gName(a.target)}の地図カードは「${m}」でした。結果はチームに共有してください。`};
    gLog(`${gName(pid)}が覗き見を使った（対象：${gName(a.target)}）`);
  }else if(kind==="scout"){
    if(!LETTERS.includes(a.L))return;const ot=other(t);const off=!!G.teams[ot].chips[a.L];
    consume(pid,a.card);
    h.reveal={title:"偵察の結果",big:a.L,text:`${teamName(ot)}の「${a.L}」のチップは${off?"裏返されています（ハズレ扱い）":"まだ表のままです"}。`};
    gLog(`${gName(pid)}が偵察を使った（${teamName(ot)}の衝立を1か所確認）`);
  }else{
    const ts=gSeat(a.target);if(!ts)return;const th=G.hands[a.target];
    const pv=th[kind];th[kind]=G.teams[ts.team].turns;
    consume(pid,a.card,{target:a.target,field:kind,prevVal:pv});
    gLog(`${gName(pid)}が${ITEM[kind].n}を使った（対象：${gName(a.target)}）`);
  }
}
function endTurn(pid,pass,bySkip){
  const s=gSeat(pid);if(!s||G.phase!=="play")return;const t=s.team;
  if(gCur(t)!==pid||G.done[t])return;
  const h=G.hands[pid],tm=G.teams[t];
  if(!pass&&!h.acted)return;
  h.endSnap={hand:JSON.parse(JSON.stringify({cards:h.cards,rope:h.rope,force:h.force,acted:h.acted,undo:h.undo})),deck:[...tm.deck],turns:tm.turns};
  while(h.cards.length<5&&tm.deck.length)h.cards.push(tm.deck.shift());
  const k=tm.turns;
  if(h.rope!=null&&k>h.rope)h.rope=null;
  if(h.force!=null&&k>h.force)h.force=null;
  h.acted=false;h.undo=null;tm.turns=k+1;G.done[t]=true;
  gLog(bySkip?`${gName(pid)}の手番をホストが終わらせた`:`${gName(pid)}が${pass?"何もせずに":""}手番を終えた`,t);
  if(G.done.A&&G.done.B)endOfTurn();
}
function endOfTurn(){
  for(const s of G.seats){const h=G.hands[s.id];if(h)h.endSnap=null;}
  if(G.pendingDecl&&G.pendingDecl.k===G.k){resolveDecl();if(G.phase!=="play")return;}
  const bl=["A","B"].filter(t=>isBlocked(t,G.cells));
  if(bl.length){G.phase="judge";G.votes=null;
    if(bl.length===2){G.blocked="both";G.winner=null;gLog("両チームの道がすべて途絶えたため、両チームとも敗北です。");}
    else{G.blocked=bl[0];G.winner=other(bl[0]);gLog(`${teamName(bl[0])}の道がすべて途絶えたため、${teamName(G.winner)}の勝利です。`);}
    return;}
  G.k++;G.done={A:false,B:false};
  for(const t of["A","B"])if(G.teams[t].turns===7)gLog(`${teamName(t)}が7手番を終えました。役割を確認できます。`,t);
}
function resolveDecl(){
  const pd=G.pendingDecl;G.pendingDecl=null;const a=pd.A,b=pd.B,ans=G.answer;
  const win=w=>{G.phase="judge";G.winner=w;G.blocked=null;G.votes=w==="both"?null:{stage:1,v:{}};};
  const tellWrong=t=>{for(const s of gOrder(t)){const h=G.hands[s.id];h.notice=`宣言は外れでした。正解カードは「${ans}」です（相手チームには伝わっていません）。「外れ：5列目以降を回収」を行ってください。`;}};
  if(a&&b){
    gLog(`同時宣言：Aチーム「${a}」、Bチーム「${b}」→ 正解は「${ans}」`);
    if(a===ans&&b===ans)win("both");else if(a===ans)win("A");else if(b===ans)win("B");
    else gLog("両チームとも外れ。両チームとも「外れ：5列目以降を回収」を行ってください。");
    return;}
  const t=a?"A":"B",L=a||b,ok=L===ans;
  gLog(`${teamName(t)}が「${L}」を宣言 → ${ok?"正解！":"外れ"}`);
  if(ok)win(t);else{gLog(`正解カードは「${ans}」でした。`,t);tellWrong(t);}
}
function undoLast(pid){
  const s=gSeat(pid);if(!s||G.phase!=="play")return;const t=s.team,h=G.hands[pid],tm=G.teams[t];
  if(G.done[t]&&gCur(t)===pid&&h.endSnap){ // 手番の終了を取り消す
    const e=h.endSnap;Object.assign(h,e.hand);tm.deck=e.deck;tm.turns=e.turns;G.done[t]=false;h.endSnap=null;
    gLog(`${gName(pid)}が手番の終了を取り消した`,t);return;}
  const u=h.undo;if(!u)return;
  if(u.kind==="place"){
    const c=G.cells[u.cell];if(c&&c.card===u.card)delete G.cells[u.cell];
    if(u.item)tm.supply[u.item]++;
    if(u.map){G.mapdeck.unshift(u.map);if(h.reveal&&h.reveal.big===u.map)h.reveal=null;}
    h.cards=u.prev.cards;h.maps=u.prev.maps;
  }else{
    const i=tm.discard.lastIndexOf(u.card);if(i>=0)tm.discard.splice(i,1);
    if(u.target&&G.hands[u.target])G.hands[u.target][u.field]=u.prevVal;
    h.cards=u.prev.cards;
  }
  h.acted=false;h.undo=null;
  gLog(`${gName(pid)}が直前の操作を取り消した`);
}
function penalty(pid){
  const s=gSeat(pid);if(!s||G.phase!=="play")return;const t=s.team,o=other(t);
  const P={A:0,B:0};
  for(const[cid,cell]of Object.entries({...G.cells})){
    const col=+cid.split("c")[1];const dist=t==="A"?col:16-col;
    const hit=cell.team===t?dist>=5:(dist>=5&&dist<=7);
    if(!hit)continue;delete G.cells[cid];
    if(TYPES[typeOf(cell.card)].item)G.teams[cell.team].discard.push(cell.card);else G.teams[cell.team].deck.push(cell.card);
    P[cell.team]++;
  }
  for(const k of["A","B"])if(P[k])G.teams[k].deck=shuffle(G.teams[k].deck);
  gLog(`${teamName(t)}が5列目以降を回収した（自チーム${P[t]}枚、${teamName(o)}${P[o]}枚）`);
}
function computeResult(){
  const sc={};G.seats.forEach(s=>{sc[s.id]=G.scores[s.id]||0;});
  const d={};const add=(id,n)=>{sc[id]=(sc[id]||0)+n;d[id]=(d[id]||0)+n;};
  const pend=[];const steal=(thief,victims,n)=>{pend.push({thief,n,victims});};
  const lines=[];const w=G.winner;
  if(G.blocked==="both"){
    G.seats.forEach(s=>{if(gRole(s.id)==="冒険者"&&sc[s.id]>0)add(s.id,-1);});
    lines.push("両チームの道が同じターンに途絶えた：両チームとも敗北。冒険者は宝1個を返す、裏切者は変化なし。");
  }else if(G.blocked){
    const L=G.blocked;
    gOrder(w).forEach(s=>{if(gRole(s.id)==="冒険者")add(s.id,1);});
    gOrder(L).forEach(s=>{if(gRole(s.id)==="冒険者"&&sc[s.id]>0)add(s.id,-1);});
    lines.push(`${teamName(L)}の道が途絶えた：${teamName(w)}の冒険者は宝1個、${teamName(L)}の冒険者は宝1個を返す。裏切者は変化なし。`);
  }else if(w==="both"){
    G.seats.forEach(s=>add(s.id,gRole(s.id)==="裏切者"?1:3));
    lines.push("両チームが同じ場所を当てた：冒険者は宝3個、裏切者は宝1個。");
  }else if(w){
    const L=other(w);
    gOrder(w).forEach(s=>{if(gRole(s.id)==="冒険者")add(s.id,5);});
    lines.push(`${teamName(w)}の冒険者は宝5個、裏切者は0個。`);
    const Lm=gOrder(L);const tr=Lm.filter(s=>gRole(s.id)==="裏切者").map(s=>s.id);const adv=Lm.filter(s=>gRole(s.id)==="冒険者").map(s=>s.id);
    const o=voteOutcome(G.votes.stage,G.votes.v,Lm);

      if(tr.length){tr.forEach(x=>steal(x,adv,2));lines.push("C：「裏切者はいない」としたが、いた。裏切者はそれぞれ宝2個を奪う。");}
      else{Lm.forEach(s=>add(s.id,1));lines.push(`D：「裏切者はいない」が正解。${teamName(L)}の全員が宝1個。`);}
    }else if(o.type==="pick"){
      if(gRole(o.target)==="裏切者"){adv.forEach(id=>add(id,2));tr.forEach(id=>add(id,1));lines.push(`A：${gName(o.target)}は裏切者だった。冒険者は宝2個、裏切者は宝1個。`);}
      else if(tr.length){tr.forEach(x=>steal(x,adv,2));lines.push(`B：${gName(o.target)}は裏切者ではなかった。裏切者はそれぞれ宝2個を奪う。`);}
      else lines.push("裏切者がいないのに指名した：誰も受け取らない。");
    }else if(o.type==="alleq")lines.push("再投票でも全員が同数：誰も受け取らない。");
    else if(o.type==="tie"){if(tr.length){tr.forEach(x=>steal(x,adv,1));lines.push("E：再投票でも一部が同数。裏切者はそれぞれ宝1個を奪う。");}else lines.push("同数のまま決まらず、裏切者もいない：誰も受け取らない。");}
  }else{
    const all=G.seats.map(s=>s.id);const tr=all.filter(id=>gRole(id)==="裏切者");const adv=all.filter(id=>gRole(id)==="冒険者");
    tr.forEach(x=>steal(x,adv,2));
    lines.push("山札切れ：裏切者はそれぞれ、両チームの冒険者から宝2個を奪う。");
  }
  return{d,sc,lines,pend};
}
function finalizeRound(){
  const r=computeResult();G.scores=r.sc;G.result={lines:r.lines,d:r.d};G.steals=r.pend;G.phase="reveal";
  gLog("役割を公開し、宝を計算しました。"+(r.pend.length?"裏切者は奪う相手を選んでください。":""));
}

/* ---------- 各プレイヤーに見せる情報だけを切り出す ---------- */
function viewFor(pid){
  const s=gSeat(pid),t=s&&s.team,h=G.hands[pid];
  const pub=t=>G.teams?{deck:G.teams[t].deck.length,discard:G.teams[t].discard.length,turns:G.teams[t].turns,supply:G.teams[t].supply}:null;
  const v={code:G.code,hostId:G.hostId,me:pid,phase:G.phase,round:G.round,
    seats:G.seats.map(x=>({id:x.id,name:x.name,team:x.team,online:!!x.online})),
    watchers:G.watchers?Object.keys(G.watchers).length:0,
    cells:G.cells,k:G.k,done:G.done,cur:{A:gCur("A"),B:gCur("B")},
    teams:G.teams?{A:pub("A"),B:pub("B")}:null,mapdeck:G.mapdeck.length,scores:G.scores,
    winner:G.winner,blocked:G.blocked,result:G.result,steals:G.steals,
    declared:G.pendingDecl&&G.pendingDecl.k===G.k?{A:!!G.pendingDecl.A,B:!!G.pendingDecl.B}:null,
    answer:G.phase==="play"?null:G.answer,
    mapsCount:Object.fromEntries(Object.entries(G.hands).map(([id,x])=>[id,(x.maps||[]).length])),
    log:G.log.filter(l=>l.vis==="all"||l.vis===t||G.phase==="reveal").slice(0,40)};
  if(t&&G.teams)v.chips=G.teams[t].chips;
  if(h&&G.teams){
    const canRole=G.teams[t].turns>=7||G.phase==="reveal";
    v.hand={cards:h.cards,maps:h.maps,rope:h.rope,force:h.force,acted:h.acted,reveal:h.reveal,notice:h.notice,
      role:canRole?h.role:null,canUndo:!!h.undo||(G.done[t]&&gCur(t)===pid&&!!h.endSnap)};
  }
  if(G.phase==="judge"&&G.votes){
    const L=other(G.winner);const Lm=gOrder(L);const all=Lm.every(x=>G.votes.v[x.id]!=null)||G.votes.final;
    v.votes={stage:G.votes.stage,final:!!G.votes.final,voted:Object.keys(G.votes.v),mine:G.votes.v[pid]??null,all:all?G.votes.v:null};
  }
  if(G.phase==="reveal")v.reveal=Object.fromEntries(G.seats.map(x=>[x.id,{role:gRole(x.id),maps:(G.hands[x.id]||{}).maps||[]}]));
  return v;
}

/* ======================================================================
   通信：ホストが部屋を開き、ほかの端末がつなぐ（PeerJS / テスト用BroadcastChannel）
   ====================================================================== */
const params=new URLSearchParams(location.search);
const LOCAL=params.has("local");
const PID=params.get("pid")||lsGet("uragiri.pid")||(()=>{const p="p"+rid(10);lsSet("uragiri.pid",p);return p;})();
if(!params.get("pid"))lsSet("uragiri.pid",PID);
let NAME=lsGet("uragiri.name")||"";
let ROLE=null; // "host" | "guest"
let CODE=null;
let peer=null,hostConn=null,bc=null;
const conns=new Map(); // pid -> {send}
let V=null;
let netState="";
const PEER_PREFIX="uragiri-tk-maui-";
function setNet(s){netState=s;$("net").textContent=s;}
function sendTo(pid,msg){
  if(pid===PID){if(msg.t==="err")toast(msg.m);return;}
  const c=conns.get(pid);if(c)try{c.send(msg);}catch(e){}
}
let commitTimer=null;
function hostCommit(){
  lsSet("uragiri.host."+CODE,JSON.stringify(G));
  for(const s of G.seats){if(s.id===PID)continue;sendTo(s.id,{t:"view",v:viewFor(s.id)});}
  if(G.watchers)for(const id of Object.keys(G.watchers))sendTo(id,{t:"view",v:viewFor(id)});
  V=viewFor(PID);render();
}
function act(a){
  if(ROLE==="host"){hostHandle(PID,a);return;}
  if(hostConn&&hostConn.open!==false){try{hostConn.send({t:"act",a});}catch(e){toast("送信できませんでした。");}}
  else toast("ホストにつながっていません。再接続を待っています…");
}
/* --- ホスト --- */
function onGuestMessage(fromPid,msg,send,ref){
  if(msg.t==="hello"){
    conns.set(fromPid,{send,ref});
    hostHandle(fromPid,{type:"join",name:msg.name});
    return;}
  if(msg.t==="act"&&conns.has(fromPid))hostHandle(fromPid,msg.a);
}
function onGuestClose(fromPid,ref){
  const c=conns.get(fromPid);if(!c||(ref&&c.ref!==ref))return;
  conns.delete(fromPid);const s=gSeat(fromPid);if(s){s.online=false;hostCommit();}
}
function startHost(code,resume){
  ROLE="host";CODE=code;lsSet("uragiri.myroom",JSON.stringify({code,role:"host"}));
  const saved=resume&&lsGet("uragiri.host."+code);
  G=saved?JSON.parse(saved):freshGame(code,PID);
  G.hostId=PID;
  for(const s of G.seats)s.online=s.id===PID;
  if(!gSeat(PID))G.seats.push({id:PID,name:NAME||"ホスト",team:"A",online:true});
  else gSeat(PID).name=NAME||gSeat(PID).name;
  history.replaceState(null,"","?room="+code+(LOCAL?"&local=1&pid="+PID:""));
  if(LOCAL){
    bc=new BroadcastChannel("uragiri-"+code);
    bc.onmessage=e=>{const m=e.data;if(m.to!=="host")return;const from=m.from;
      onGuestMessage(from,m.data,data=>bc.postMessage({to:from,data}));};
    setNet("部屋を開きました（テスト）");hostCommit();return;
  }
  setNet("部屋を開いています…");
  const open=(tries)=>{
    peer=new Peer(PEER_PREFIX+code,{debug:0});
    peer.on("open",()=>{setNet("部屋を開きました");hostCommit();});
    peer.on("connection",conn=>{
      let who=null;
      conn.on("data",m=>{if(m&&m.t==="hello")who=m.pid;if(who)onGuestMessage(who,m,d=>conn.send(d),conn);});
      conn.on("close",()=>{if(who)onGuestClose(who,conn);});
      conn.on("error",()=>{});
    });
    peer.on("disconnected",()=>{setNet("接続を立て直しています…");try{peer.reconnect();}catch(e){}});
    peer.on("error",e=>{
      if(e.type==="unavailable-id"&&tries<10){setNet("前の接続が残っています。少し待っています…");peer.destroy();setTimeout(()=>open(tries+1),3000);return;}
      if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"){setNet("通信エラー。再接続します…");setTimeout(()=>{try{peer.reconnect();}catch(_){}},3000);return;}
      console.warn(e);
    });
  };
  open(0);
  hostCommit();
}

function startGuest(code){
  ROLE="guest";CODE=code;lsSet("uragiri.myroom",JSON.stringify({code,role:"guest"}));
  history.replaceState(null,"","?room="+code+(LOCAL?"&local=1&pid="+PID:""));
  render();
  if(LOCAL){
    bc=new BroadcastChannel("uragiri-"+code);
    bc.onmessage=e=>{const m=e.data;if(m.to!==PID)return;onHostMessage(m.data);};
    hostConn={send:d=>bc.postMessage({to:"host",from:PID,data:d}),open:true};
    hostConn.send({t:"hello",pid:PID,name:NAME});setNet("接続しました（テスト）");
    setInterval(()=>{if(!V)hostConn.send({t:"hello",pid:PID,name:NAME});},1000);return;
  }
  setNet("部屋に接続しています…");
  peer=new Peer({debug:0});
  let retryT=null,attempt=0;
  const retry=(ms,msg)=>{if(msg)setNet(msg);if(retryT)return;retryT=setTimeout(()=>{retryT=null;connect();},ms);};
  const connect=()=>{
    const my=++attempt;
    if(peer.disconnected){try{peer.reconnect();}catch(e){}retry(3000);return;}
    const c=peer.connect(PEER_PREFIX+code,{reliable:true});
    let opened=false;
    const timer=setTimeout(()=>{if(!opened&&my===attempt){try{c.close();}catch(e){}retry(2000,"つながりません。再試行しています…");}},15000);
    c.on("open",()=>{opened=true;clearTimeout(timer);hostConn=c;setNet("接続しました");c.send({t:"hello",pid:PID,name:NAME});});
    c.on("data",onHostMessage);
    c.on("close",()=>{clearTimeout(timer);if(hostConn===c){hostConn=null;retry(2500,"切断されました。再接続しています…");}});
    c.on("error",()=>{});
  };
  peer.on("open",()=>connect());
  peer.on("disconnected",()=>{try{peer.reconnect();}catch(e){}});
  peer.on("error",e=>{
    if(e.type==="peer-unavailable"){retry(4000,"部屋が見つかりません。ホストが部屋を開いているか確認してください。再試行しています…");return;}
    if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"){retry(4000,"通信エラー。再接続しています…");return;}
    console.warn(e);
  });
}

function pickAction(card){

    }}},`${s.name}（${s.team}）`))));

    showSheet(`${ITEM[a].n}：対象のプレイヤーを選ぶ`,el("div",{cls:"row"},V.seats.map(s=>el("button",{cls:"btn",on:{click:()=>{closeSheet();act({type:"use",card,target:s.id});ui.sel=null;}}},`${s.name}（${s.team}）`))));

function declare(){
  const t=myTeam();const rooms=[...network(t,V.cells).rooms];
  if(!rooms.length){toast("まだ宝の間に道がつながっていません。");return;}
  if(V.declared&&V.declared[t]){toast("このターンはもう宣言しています。");return;}
  showSheet("宝の間で宣言",el("p",null,"チームで相談して、宝だと思うアルファベットを選んでください。結果はこのターンの両チームの手番が終わってから出ます。"),
    ...rooms.map(g=>el("div",{cls:"row",style:"margin:8px 0"},el("span",{cls:"muted"},`${g}の宝の間：`),
      g.split("").map(L=>el("button",{cls:"chip dot",on:{click:async()=>{if(await ask("宣言の確認",`${teamName(t)}として「${L}」を宣言しますか？`,"宣言する"))act({type:"declare",L});}}},L)))));

const targetName=x=>x==="none"?"裏切者はいない":vName(x);
function renderJudge(v){

        el("button",{cls:"btn",on:{click:()=>act({type:"vote",target:"none"})}},"裏切者はいない")));
  }else if(t===L&&!vt.final)sec.append(el("p",null,`あなたの投票：${targetName(vt.mine)}。ほかの人の投票を待っています。`));

/* ---------- シート ---------- */
let sheetEl=null,sheetResolve=null;
function ask(title,text,okLabel){return new Promise(res=>{showSheet(title,el("p",null,text),el("div",{cls:"row"},el("button",{cls:"btn pri",on:{click:()=>{sheetResolve=null;closeSheet();res(true);}}},okLabel||"はい")));sheetResolve=res;});}
function showSheet(title,...content){
  closeSheet();
  sheetEl=el("div",{cls:"overlay",on:{click:e=>{if(e.target===sheetEl)closeSheet();}}},
    el("div",{cls:"sheet",role:"dialog","aria-modal":"true","aria-label":title},el("h3",null,title),...content,
      el("div",{cls:"row",style:"margin-top:12px"},el("button",{cls:"btn",on:{click:closeSheet}},"閉じる"))));
  document.body.append(sheetEl);const b=sheetEl.querySelector("button");if(b)b.focus();
}
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null;}if(sheetResolve){const r=sheetResolve;sheetResolve=null;r(false);}}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

/* ---------- 起動 ---------- */
(function boot(){
  const room=(params.get("room")||"").toUpperCase();
  const mine=(()=>{try{return JSON.parse(lsGet("uragiri.myroom")||"null");}catch(e){return null;}})();
  if(room&&mine&&mine.code===room&&NAME){mine.role==="host"?startHost(room,true):startGuest(room);return;}
  if(typeof Peer==="undefined"&&!LOCAL){render();toast("通信ライブラリを読み込めませんでした。再読み込みしてください。");return;}
  render();
})();
